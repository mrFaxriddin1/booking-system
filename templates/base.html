<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bron tizimi{% endblock title %}</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #222; }
        a { color: #2563eb; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .btn { display: inline-block; padding: 8px 16px; background: #2563eb; color: white; border-radius: 6px; text-decoration: none; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1><a href="{% url "home" %}">Bron tizimi</a></h1>
    {% if messages %}
        {% for message in messages %}
            <p class="card">{{ message }}</p>
        {% endfor %}
    {% endif %}
    
    {% block content %}{% endblock content %}
</body>
</html>
